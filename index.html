<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSHD 2.0 多源异构灾情数据管理系统</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://assets.pyecharts.org/assets/maps/china.js"></script>
</head>
<body>
    <div class="app-container">
        <div class="main-panel">
            <header>
                <h1>灾情数据一体化管理平台</h1>
                <div class="stats-row">
                    <div class="stat-card">
                        <h3>实时灾情数</h3>
                        <span id="total-count">0</span>
                    </div>
                    <div class="stat-card warning">
                        <h3>最新更新</h3>
                        <span id="latest-time">--:--</span>
                    </div>
                </div>
            </header>

            <div class="map-container">
                <div id="china-map"></div>
            </div>

            <div class="data-list-section">
                <h2>灾情数据流 </h2>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>一体化编码 ID</th>
                                <th>时间</th>
                                <th>地区</th>
                                <th>类型</th>
                                <th>详情/文件</th>
                            </tr>
                        </thead>
                        <tbody id="report-table-body">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

       <div class="control-panel">
                <h2>📝 灾情上报接口</h2>
                <form id="upload-form">
                    <div class="form-group">
                        <label>地理位置 </label>
                        <input type="text" name="geo_code" placeholder="如: 110101001001" required value="110101001001">
                        <!-- <small>需在 region_code.csv 中存在</small> -->
                    </div>
    
                    <div class="form-group">
                        <label>发生时间</label>
                        <input type="text" name="time_code" id="time_input" required>
                        <button type="button" class="btn-small" onclick="fillTime()">填入当前时间</button>
                    </div>
    
                    <div class="form-row">
                        <div class="form-group">
                            <label>来源大类</label>
                            <select name="source_main" id="source_main" onchange="updateSourceSub()">
                                </select>
                        </div>
                        <div class="form-group">
                            <label>来源子类</label>
                            <select name="source_sub" id="source_sub">
                                </select>
                        </div>
                    </div>
    
                    <div class="form-group">
                        <label>灾情分类与指标</label>
                        <div class="multi-select" style="display:flex; flex-direction:column; gap:5px;">
                            <select name="dis_main" id="dis_main" onchange="updateDisasterSubAndInd()">
                                <option value="" disabled selected>选择灾害大类</option>
                            </select>
                            <select name="dis_sub" id="dis_sub">
                                <option value="" disabled selected>选择子类</option>
                            </select>
                            <select name="dis_indicator" id="dis_indicator">
                                <option value="" disabled selected>选择指标</option>
                            </select>
                        </div>
                    </div>
    
                    <div class="form-group">
                        <label>数据载体类型</label>
                        <select name="carrier_code" id="carrier-select" onchange="toggleFileField()">
                            <option value="0">文字描述</option>
                            <option value="1">图像文件</option>
                            <option value="2">音频文件</option>
                            <option value="3">视频文件</option>
                            <option value="4">其他</option>
                        </select>
                    </div>
    
                    <div class="form-group" id="text-field">
                        <label>核心数据内容</label>
                        <textarea name="text_content" rows="3" placeholder="例如: 房屋倒塌面积约500平米..."></textarea>
                    </div>
    
                    <div class="form-group hidden" id="file-field">
                        <label>上传多媒体文件</label>
                        <input type="file" name="file_content">
                    </div>
    
                    <button type="submit" class="btn-submit">生成编码并上报</button>
                </form>
    
                <div class="system-log">
                    <h3>系统日志</h3>
                    <div id="log-content">等待数据录入...</div>
                </div>
            </div>

    <div id="detail-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">省份详情</h3>
                <span class="close-btn" onclick="closeModal()">×</span>
            </div>
            <div class="modal-body" id="modal-list">
                </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
